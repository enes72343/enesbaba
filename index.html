<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Query Interface</title>

<style>
*{margin:0;padding:0;box-sizing:border-box}

body{
    font-family:JetBrains Mono,Consolas,monospace;
    background:#02040f;
    color:#d1d5db;
    height:100vh;
    overflow:hidden
}

/* BACKGROUND */
canvas{position:fixed;inset:0;z-index:-2}
.grid{
    position:fixed;
    inset:0;
    background:
      linear-gradient(rgba(255,255,255,.04) 1px,transparent 1px),
      linear-gradient(90deg,rgba(255,255,255,.04) 1px,transparent 1px);
    background-size:40px 40px;
    z-index:-1;
    animation:gridMove 30s linear infinite
}
@keyframes gridMove{
    from{background-position:0 0,0 0}
    to{background-position:400px 400px,400px 400px}
}

/* LAYOUT */
.app{
    display:grid;
    grid-template-columns:260px 1fr 360px;
    height:100vh
}

/* LEFT */
.sidebar{
    border-right:1px solid rgba(255,255,255,.08);
    padding:18px;
    overflow:auto
}
.sidebar h2{
    font-size:.9rem;
    margin-bottom:14px;
    opacity:.7
}
.source{
    padding:10px;
    border:1px solid rgba(255,255,255,.08);
    border-radius:10px;
    margin-bottom:10px;
    cursor:pointer;
    transition:.2s
}
.source:hover{background:rgba(255,255,255,.05)}
.source.active{
    border-color:#22c55e;
    background:rgba(34,197,94,.12)
}
.source small{opacity:.6}

/* CENTER */
.center{
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    gap:30px;
    padding:20px
}
.display{
    width:100%;
    max-width:520px;
    background:#050820;
    border:1px solid rgba(255,255,255,.08);
    border-radius:18px;
    padding:26px;
    text-align:center;
    box-shadow:0 0 40px rgba(34,197,94,.15)
}
.display h1{
    font-size:1.4rem;
    margin-bottom:10px;
    font-weight:600
}
.display p{
    font-size:.85rem;
    opacity:.6
}
.action{
    padding:14px 36px;
    border:none;
    border-radius:14px;
    font-size:.9rem;
    font-weight:600;
    background:linear-gradient(135deg,#22c55e,#16a34a);
    color:#02040f;
    cursor:pointer
}
.action:disabled{opacity:.4}

/* RIGHT */
.output{
    border-left:1px solid rgba(255,255,255,.08);
    padding:18px;
    overflow:auto
}
.output h2{
    font-size:.9rem;
    margin-bottom:12px;
    opacity:.7
}
.result{
    background:#050820;
    border-radius:14px;
    padding:18px;
    border:1px solid rgba(255,255,255,.08)
}
.email{word-break:break-all;font-weight:600}
.pass{margin:12px 0;color:#f87171}
.copy{
    padding:10px;
    width:100%;
    border:none;
    border-radius:10px;
    background:#2563eb;
    color:#fff;
    cursor:pointer
}

/* MOBILE */
@media(max-width:900px){
    .app{grid-template-columns:1fr}
    .sidebar,.output{display:none}
}
</style>
</head>

<body>

<canvas id="stars"></canvas>
<div class="grid"></div>

<div class="app">

<div class="sidebar" id="sources"></div>

<div class="center">
    <div class="display">
        <h1>Data Query Interface</h1>
        <p>Select a source and request a random entry</p>
    </div>
    <button class="action" id="getBtn" disabled>EXECUTE QUERY</button>
</div>

<div class="output">
    <h2>Query Result</h2>
    <div id="result"></div>
</div>

</div>

<script>
/* STARFIELD */
const c=document.getElementById('stars'),ctx=c.getContext('2d');
let w,h,stars=[];
function resize(){
    w=c.width=innerWidth;
    h=c.height=innerHeight;
}
onresize=resize;resize();
for(let i=0;i<250;i++){
    stars.push({x:Math.random()*w,y:Math.random()*h,z:Math.random()*w})
}
function anim(){
    ctx.fillStyle='#02040f';
    ctx.fillRect(0,0,w,h);
    for(const s of stars){
        s.z-=1.2;
        if(s.z<=0)s.z=w;
        const k=128/s.z;
        const px=s.x*k+w/2;
        const py=s.y*k+h/2;
        if(px>0&&px<w&&py>0&&py<h){
            const size=(1-k)*2;
            ctx.fillStyle='#fff';
            ctx.fillRect(px,py,size,size)
        }
    }
    requestAnimationFrame(anim)
}
anim();

/* DATA SYSTEM */
const FILES=[
 'spotify','disneyplus','tabii','tabipremium',
 'origin','uplay','discord','minecraft','instagram','facebook'
];

let data={},selected=null;

async function init(){
    for(const f of FILES){
        try{
            const r=await fetch(f+'.txt');
            if(!r.ok)continue;
            const t=await r.text();
            data[f]=t.split('\n').filter(l=>l.includes(':'));
        }catch{}
    }
    renderSources();
}
function renderSources(){
    sources.innerHTML=Object.keys(data).map(k=>
    `<div class="source" onclick="select('${k}')">
        <div>${k.toUpperCase()}</div>
        <small>${data[k].length} entries</small>
    </div>`
    ).join('');
}
function select(k){
    document.querySelectorAll('.source').forEach(s=>s.classList.remove('active'));
    event.currentTarget.classList.add('active');
    selected=k;
    getBtn.disabled=false;
}
getBtn.onclick=()=>{
    const list=data[selected];
    const l=list[Math.floor(Math.random()*list.length)];
    const i=l.indexOf(':');
    const e=l.slice(0,i),p=l.slice(i+1);
    result.innerHTML=
    `<div class="result">
        <div class="email">${e}</div>
        <div class="pass">${p}</div>
        <button class="copy" onclick="navigator.clipboard.writeText('${e}:${p}')">COPY</button>
     </div>`;
};

init();
</script>
</body>
</html>
