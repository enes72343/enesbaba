<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Random Hesap Dağıtıcı</title>

<style>
*{margin:0;padding:0;box-sizing:border-box}
body{
    font-family:Segoe UI,Tahoma,sans-serif;
    background:linear-gradient(135deg,#667eea,#764ba2);
    min-height:100vh;
    padding:20px
}
.container{
    max-width:900px;
    margin:auto;
    background:#fff;
    border-radius:16px;
    overflow:hidden;
    box-shadow:0 20px 40px rgba(0,0,0,.15)
}
.header{
    background:linear-gradient(135deg,#2c3e50,#34495e);
    color:#fff;
    padding:30px;
    text-align:center
}
.content{padding:25px}
.stats{
    background:#f1f3f5;
    padding:12px;
    border-radius:8px;
    text-align:center;
    margin-bottom:15px;
    font-weight:500
}
.file-list{
    background:#fafafa;
    border:1px solid #e9ecef;
    border-radius:10px;
    padding:10px;
    margin-bottom:25px
}
.file-item{
    display:flex;
    justify-content:space-between;
    padding:8px;
    font-size:.95rem
}
.account-types{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(160px,1fr));
    gap:15px
}
.account-card{
    background:#f8f9fa;
    border-radius:12px;
    padding:18px 10px;
    text-align:center;
    cursor:pointer;
    transition:.25s;
    border:2px solid transparent
}
.account-card:hover{
    transform:translateY(-4px);
    box-shadow:0 8px 18px rgba(0,0,0,.12)
}
.account-card.selected{
    border-color:#27ae60;
    background:#eafaf1
}
.account-icon{font-size:2.2rem;margin-bottom:6px}
.account-name{font-weight:600}
.account-count{font-size:.85rem;color:#6c757d}
.controls{
    display:flex;
    justify-content:center;
    gap:15px;
    margin:30px 0;
    flex-wrap:wrap
}
.btn{
    border:none;
    border-radius:10px;
    padding:14px 26px;
    font-size:1rem;
    font-weight:600;
    cursor:pointer
}
.btn-success{
    background:linear-gradient(135deg,#27ae60,#219a52);
    color:#fff
}
.btn-secondary{
    background:linear-gradient(135deg,#3498db,#2980b9);
    color:#fff
}
.btn:disabled{opacity:.6;cursor:not-allowed}
.result{
    background:#f1f3f5;
    border-radius:12px;
    padding:20px
}
.account-result{
    background:#fff;
    border:2px solid #27ae60;
    border-radius:12px;
    padding:20px;
    text-align:center
}
.account-email{font-size:1.2rem;font-weight:600}
.account-password{font-family:monospace;color:#e74c3c;margin:10px 0}
.copy-btn{
    background:#3498db;
    color:#fff;
    border:none;
    border-radius:8px;
    padding:10px 18px;
    cursor:pointer
}
.loading{text-align:center}
.spinner{
    width:36px;height:36px;
    border:4px solid #ddd;
    border-top:4px solid #3498db;
    border-radius:50%;
    margin:10px auto;
    animation:spin 1s linear infinite
}
@keyframes spin{to{transform:rotate(360deg)}}
.error{
    background:#f8d7da;
    color:#721c24;
    padding:12px;
    border-radius:8px;
    text-align:center
}
</style>
</head>

<body>
<div class="container">
    <div class="header">
        <h1>🎲 Random Hesap Dağıtıcı</h1>
        <p>Aynı klasördeki TXT dosyalarından rastgele hesap verir</p>
    </div>

    <div class="content">
        <div class="stats" id="stats">Dosyalar taranıyor...</div>
        <div class="file-list" id="fileList"></div>

        <h2 style="text-align:center;margin:20px 0">🎯 Hesap Türü</h2>
        <div class="account-types" id="accountTypes"></div>

        <div class="controls">
            <button class="btn btn-success" id="getBtn" disabled>🎲 Hesap Getir</button>
            <button class="btn btn-secondary" id="againBtn" style="display:none">🔄 Yenisi</button>
        </div>

        <div class="result" id="result" style="display:none">
            <div class="loading" id="loading">
                <div class="spinner"></div>
                Yükleniyor...
            </div>
            <div id="resultContent"></div>
        </div>
    </div>
</div>

<script>
const FILES=[
 'spotify',
 'disneyplus',
 'tabii',
 'tabipremium',
 'origin',
 'uplay',
 'discord',
 'minecraft',
 'instagram',
 'facebook'
];

const ICONS={
 spotify:'🎵',
 disneyplus:'🏰',
 tabii:'📺',
 tabipremium:'⭐',
 origin:'🕹️',
 uplay:'🎯',
 discord:'💬',
 minecraft:'⛏️',
 instagram:'📷',
 facebook:'👥'
};

let accounts={},selected=null;

async function init(){
 let found=[];
 for(const f of FILES){
   try{
     const r=await fetch(f+'.txt');
     if(r.ok){found.push(f);load(f)}
   }catch{}
 }
 document.getElementById('stats').innerText=
   found.length?`Bulunanlar: ${found.join(', ').toUpperCase()}`:'TXT yok';
 renderFiles(found);
 renderCards(found);
}

async function load(type){
 const r=await fetch(type+'.txt');
 const t=await r.text();
 accounts[type]=t.split('\n')
   .map(l=>l.trim())
   .filter(l=>l.includes(':'))
   .map(l=>{
     const i=l.indexOf(':');
     return{email:l.slice(0,i),pass:l.slice(i+1)}
   });
}

function renderFiles(types){
 fileList.innerHTML=types.map(t=>
 `<div class="file-item"><span>${t}.txt</span><span>${accounts[t]?.length||'...'}</span></div>`
 ).join('');
}

function renderCards(types){
 accountTypes.innerHTML=types.map(t=>
 `<div class="account-card" onclick="selectType('${t}')" id="c-${t}">
   <div class="account-icon">${ICONS[t]||'📁'}</div>
   <div class="account-name">${t.toUpperCase()}</div>
   <div class="account-count">${accounts[t]?.length||0} hesap</div>
 </div>`
 ).join('');
}

function selectType(t){
 document.querySelectorAll('.account-card').forEach(c=>c.classList.remove('selected'));
 document.getElementById('c-'+t).classList.add('selected');
 selected=t;
 getBtn.disabled=false;
}

function getAccount(){
 if(!selected)return;
 result.style.display='block';
 loading.style.display='block';
 resultContent.innerHTML='';
 setTimeout(()=>{
   const list=accounts[selected];
   const a=list[Math.floor(Math.random()*list.length)];
   loading.style.display='none';
   resultContent.innerHTML=
   `<div class="account-result">
     <div class="account-email">${a.email}</div>
     <div class="account-password">${a.pass}</div>
     <button class="copy-btn" onclick="copy('${a.email}','${a.pass}')">📋 Kopyala</button>
   </div>`;
   againBtn.style.display='inline-block';
 },500);
}

function copy(e,p){
 navigator.clipboard.writeText(`Email: ${e}\nŞifre: ${p}`);
}

getBtn.onclick=getAccount;
againBtn.onclick=getAccount;
init();
</script>
</body>
</html>
