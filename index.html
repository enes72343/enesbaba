<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Random Hesap Dağıtıcı</title>

<style>
*{margin:0;padding:0;box-sizing:border-box}
body{
    font-family:Segoe UI,Tahoma,sans-serif;
    min-height:100vh;
    background:#0f1225;
    color:#fff;
    overflow-x:hidden
}

/* ⭐ YILDIZ ARKA PLAN */
#stars{
    position:fixed;
    inset:0;
    z-index:-1
}

.container{
    max-width:900px;
    margin:auto;
    padding:20px
}
.panel{
    background:rgba(20,24,60,.9);
    border-radius:18px;
    box-shadow:0 20px 40px rgba(0,0,0,.5);
    overflow:hidden;
    backdrop-filter:blur(6px)
}
.header{
    padding:30px;
    text-align:center;
    background:linear-gradient(135deg,#1b1f4a,#272c6d)
}
.header h1{font-size:2.2rem}
.header p{opacity:.8;margin-top:6px}

.content{padding:25px}

.stats{
    background:#161a40;
    padding:12px;
    border-radius:10px;
    text-align:center;
    margin-bottom:15px
}

.file-list{
    background:#11143a;
    border-radius:12px;
    padding:12px;
    margin-bottom:25px
}
.file-item{
    display:flex;
    justify-content:space-between;
    padding:6px 0;
    font-size:.9rem;
    opacity:.85
}

.account-types{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(150px,1fr));
    gap:15px
}
.account-card{
    background:#161a40;
    border-radius:14px;
    padding:18px 10px;
    text-align:center;
    cursor:pointer;
    transition:.25s;
    border:2px solid transparent
}
.account-card:hover{
    transform:translateY(-4px);
    box-shadow:0 10px 25px rgba(0,0,0,.4)
}
.account-card.selected{
    border-color:#27ae60;
    background:#1c2b2f
}
.account-icon{font-size:2.2rem}
.account-name{font-weight:600;margin-top:6px}
.account-count{font-size:.8rem;opacity:.7}

.controls{
    display:flex;
    justify-content:center;
    gap:15px;
    margin:30px 0;
    flex-wrap:wrap
}
.btn{
    border:none;
    border-radius:12px;
    padding:14px 26px;
    font-size:1rem;
    font-weight:600;
    cursor:pointer;
    color:#fff
}
.btn-success{
    background:linear-gradient(135deg,#27ae60,#1e8f50)
}
.btn-secondary{
    background:linear-gradient(135deg,#3498db,#21618c)
}
.btn:disabled{opacity:.5;cursor:not-allowed}

.result{
    background:#0f1438;
    border-radius:14px;
    padding:20px;
    margin-top:15px
}
.account-result{
    background:#161a40;
    border:2px solid #27ae60;
    border-radius:14px;
    padding:20px;
    text-align:center
}
.account-email{font-size:1.1rem;font-weight:600}
.account-password{
    font-family:monospace;
    color:#ff7675;
    margin:12px 0
}
.copy-btn{
    background:#3498db;
    border:none;
    border-radius:10px;
    padding:10px 18px;
    cursor:pointer;
    color:#fff
}

.loading{text-align:center}
.spinner{
    width:36px;height:36px;
    border:4px solid #333;
    border-top:4px solid #3498db;
    border-radius:50%;
    margin:10px auto;
    animation:spin 1s linear infinite
}
@keyframes spin{to{transform:rotate(360deg)}}

@media(max-width:600px){
    .header h1{font-size:1.7rem}
}
</style>
</head>

<body>

<canvas id="stars"></canvas>

<div class="container">
<div class="panel">

<div class="header">
    <h1>🎲 Random Hesap Dağıtıcı</h1>
    <p>Sorgu paneli – rastgele hesap seçimi</p>
</div>

<div class="content">
    <div class="stats" id="stats">Dosyalar taranıyor…</div>
    <div class="file-list" id="fileList"></div>

    <h2 style="text-align:center;margin:20px 0">🎯 Hesap Türü</h2>
    <div class="account-types" id="accountTypes"></div>

    <div class="controls">
        <button class="btn btn-success" id="getBtn" disabled>🎲 Hesap Getir</button>
        <button class="btn btn-secondary" id="againBtn" style="display:none">🔄 Yenisi</button>
    </div>

    <div class="result" id="result" style="display:none">
        <div class="loading" id="loading">
            <div class="spinner"></div>
            Yükleniyor…
        </div>
        <div id="resultContent"></div>
    </div>
</div>

</div>
</div>

<script>
/* ⭐ YILDIZ ANİMASYONU */
const canvas=document.getElementById('stars');
const ctx=canvas.getContext('2d');
let w,h,stars=[];
function resize(){
    w=canvas.width=window.innerWidth;
    h=canvas.height=window.innerHeight;
}
window.onresize=resize;resize();

for(let i=0;i<120;i++){
    stars.push({
        x:Math.random()*w,
        y:Math.random()*h,
        r:Math.random()*1.5+0.5,
        s:Math.random()*0.5+0.2
    });
}
function animate(){
    ctx.clearRect(0,0,w,h);
    ctx.fillStyle="#fff";
    stars.forEach(s=>{
        ctx.globalAlpha=Math.random();
        ctx.beginPath();
        ctx.arc(s.x,s.y,s.r,0,Math.PI*2);
        ctx.fill();
        s.y+=s.s;
        if(s.y>h){s.y=0;s.x=Math.random()*w}
    });
    requestAnimationFrame(animate);
}
animate();

/* 📂 HESAP SİSTEMİ */
const FILES=[
 'spotify','disneyplus','tabii','tabipremium',
 'origin','uplay','discord','minecraft','instagram','facebook'
];
const ICONS={
 spotify:'🎵',disneyplus:'🏰',tabii:'📺',tabipremium:'⭐',
 origin:'🕹️',uplay:'🎯',discord:'💬',minecraft:'⛏️',
 instagram:'📷',facebook:'👥'
};
let accounts={},selected=null;

async function init(){
 let found=[];
 for(const f of FILES){
   try{
     const r=await fetch(f+'.txt');
     if(r.ok){found.push(f);load(f)}
   }catch{}
 }
 stats.innerText=found.length
   ?`Bulunan dosyalar: ${found.join(', ').toUpperCase()}`
   :'TXT bulunamadı';
 renderFiles(found);
 renderCards(found);
}
async function load(t){
 const r=await fetch(t+'.txt');
 const txt=await r.text();
 accounts[t]=txt.split('\n')
   .map(l=>l.trim())
   .filter(l=>l.includes(':'))
   .map(l=>{
     const i=l.indexOf(':');
     return{email:l.slice(0,i),pass:l.slice(i+1)}
   });
}
function renderFiles(t){
 fileList.innerHTML=t.map(x=>
 `<div class="file-item"><span>${x}.txt</span><span>${accounts[x]?.length||'…'}</span></div>`
 ).join('');
}
function renderCards(t){
 accountTypes.innerHTML=t.map(x=>
 `<div class="account-card" id="c-${x}" onclick="selectType('${x}')">
   <div class="account-icon">${ICONS[x]||'📁'}</div>
   <div class="account-name">${x.toUpperCase()}</div>
   <div class="account-count">${accounts[x]?.length||0} hesap</div>
 </div>`
 ).join('');
}
function selectType(t){
 document.querySelectorAll('.account-card').forEach(c=>c.classList.remove('selected'));
 document.getElementById('c-'+t).classList.add('selected');
 selected=t;getBtn.disabled=false;
}
function getAccount(){
 if(!selected)return;
 result.style.display='block';
 loading.style.display='block';
 resultContent.innerHTML='';
 setTimeout(()=>{
   const a=accounts[selected][Math.floor(Math.random()*accounts[selected].length)];
   loading.style.display='none';
   resultContent.innerHTML=
   `<div class="account-result">
     <div class="account-email">${a.email}</div>
     <div class="account-password">${a.pass}</div>
     <button class="copy-btn" onclick="navigator.clipboard.writeText('Email: ${a.email}\\nŞifre: ${a.pass}')">📋 Kopyala</button>
   </div>`;
   againBtn.style.display='inline-block';
 },500);
}
getBtn.onclick=getAccount;
againBtn.onclick=getAccount;
init();
</script>

</body>
</html>
