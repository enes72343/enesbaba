<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Account Query Panel</title>

<style>
*{margin:0;padding:0;box-sizing:border-box}

body{
    font-family:Inter,Segoe UI,Tahoma,sans-serif;
    background:#05060f;
    color:#e5e7eb;
    min-height:100vh;
    overflow:hidden
}

/* STAR CANVAS */
#space{
    position:fixed;
    inset:0;
    z-index:-1
}

/* LAYOUT */
.wrapper{
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:20px
}

.panel{
    width:100%;
    max-width:900px;
    background:rgba(10,14,40,.85);
    border-radius:18px;
    box-shadow:0 30px 80px rgba(0,0,0,.6);
    backdrop-filter:blur(10px);
    border:1px solid rgba(255,255,255,.06)
}

.header{
    padding:28px;
    text-align:center;
    border-bottom:1px solid rgba(255,255,255,.08)
}
.header h1{
    font-size:1.9rem;
    font-weight:600;
    letter-spacing:.5px
}
.header p{
    margin-top:8px;
    font-size:.9rem;
    opacity:.7
}

.content{padding:24px}

/* STATUS */
.stats{
    background:#0c1130;
    border:1px solid rgba(255,255,255,.06);
    padding:12px;
    border-radius:10px;
    text-align:center;
    font-size:.9rem;
    margin-bottom:18px
}

/* FILE LIST */
.file-list{
    background:#080b22;
    border-radius:12px;
    padding:12px;
    margin-bottom:28px
}
.file-item{
    display:flex;
    justify-content:space-between;
    padding:6px 0;
    font-size:.85rem;
    opacity:.75
}

/* ACCOUNT TYPES */
.account-types{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(160px,1fr));
    gap:14px
}
.account-card{
    background:#0b1030;
    border:1px solid rgba(255,255,255,.06);
    border-radius:14px;
    padding:18px;
    cursor:pointer;
    transition:.25s
}
.account-card:hover{
    transform:translateY(-4px);
    box-shadow:0 12px 30px rgba(0,0,0,.5)
}
.account-card.selected{
    border-color:#22c55e;
    background:#0e2a1c
}
.account-name{
    font-weight:600;
    letter-spacing:.3px
}
.account-count{
    font-size:.8rem;
    opacity:.6;
    margin-top:6px
}

/* CONTROLS */
.controls{
    display:flex;
    justify-content:center;
    gap:14px;
    margin:30px 0;
    flex-wrap:wrap
}
button{
    border:none;
    padding:14px 28px;
    border-radius:12px;
    font-size:.95rem;
    font-weight:600;
    cursor:pointer;
    color:#fff;
    background:linear-gradient(135deg,#2563eb,#1e40af)
}
button.secondary{
    background:linear-gradient(135deg,#334155,#1e293b)
}
button:disabled{
    opacity:.4;
    cursor:not-allowed
}

/* RESULT */
.result{
    background:#080b22;
    border-radius:14px;
    padding:20px;
    border:1px solid rgba(255,255,255,.06)
}
.account-result{
    background:#0b1030;
    border-radius:14px;
    padding:22px;
    text-align:center;
    border:1px solid rgba(34,197,94,.6)
}
.account-email{
    font-size:1.05rem;
    font-weight:600;
    word-break:break-all
}
.account-password{
    margin:14px 0;
    font-family:monospace;
    color:#f87171
}

/* LOADING */
.loading{text-align:center}
.spinner{
    width:34px;height:34px;
    border:4px solid rgba(255,255,255,.15);
    border-top:4px solid #3b82f6;
    border-radius:50%;
    margin:12px auto;
    animation:spin 1s linear infinite
}
@keyframes spin{to{transform:rotate(360deg)}}

/* MOBILE */
@media(max-width:600px){
    .header h1{font-size:1.6rem}
}
</style>
</head>

<body>

<canvas id="space"></canvas>

<div class="wrapper">
<div class="panel">

<div class="header">
    <h1>Account Query Panel</h1>
    <p>Local text sources based random distribution</p>
</div>

<div class="content">

<div class="stats" id="stats">Scanning files...</div>
<div class="file-list" id="fileList"></div>

<div class="account-types" id="accountTypes"></div>

<div class="controls">
    <button id="getBtn" disabled>Get Account</button>
    <button class="secondary" id="againBtn" style="display:none">Get Another</button>
</div>

<div class="result" id="result" style="display:none">
    <div class="loading" id="loading">
        <div class="spinner"></div>
        Loading
    </div>
    <div id="resultContent"></div>
</div>

</div>
</div>
</div>

<script>
/* STARFIELD */
const c=document.getElementById('space'),x=c.getContext('2d');
let w,h,stars=[];
function resize(){
    w=c.width=window.innerWidth;
    h=c.height=window.innerHeight;
}
window.onresize=resize;resize();

for(let i=0;i<200;i++){
    stars.push({
        x:Math.random()*w,
        y:Math.random()*h,
        z:Math.random()*w
    });
}
function draw(){
    x.fillStyle="#05060f";
    x.fillRect(0,0,w,h);
    for(const s of stars){
        s.z-=2;
        if(s.z<=0){s.z=w}
        const k=128/s.z;
        const px=s.x*k+w/2;
        const py=s.y*k+h/2;
        if(px>=0&&px<=w&&py>=0&&py<=h){
            const size=(1-k)*2;
            x.fillStyle="#ffffff";
            x.fillRect(px,py,size,size);
        }
    }
    requestAnimationFrame(draw);
}
draw();

/* ACCOUNT SYSTEM */
const FILES=[
 'spotify','disneyplus','tabii','tabipremium',
 'origin','uplay','discord','minecraft','instagram','facebook'
];

let accounts={},selected=null;

async function init(){
 let found=[];
 for(const f of FILES){
   try{
     const r=await fetch(f+'.txt');
     if(r.ok){found.push(f);load(f)}
   }catch{}
 }
 stats.textContent=found.length
   ?'Detected: '+found.join(', ').toUpperCase()
   :'No text files found';
 renderFiles(found);
 renderCards(found);
}

async function load(t){
 const r=await fetch(t+'.txt');
 const txt=await r.text();
 accounts[t]=txt.split('\n')
   .map(l=>l.trim())
   .filter(l=>l.includes(':'))
   .map(l=>{
     const i=l.indexOf(':');
     return{email:l.slice(0,i),pass:l.slice(i+1)}
   });
}

function renderFiles(t){
 fileList.innerHTML=t.map(a=>
 `<div class="file-item"><span>${a}.txt</span><span>${accounts[a]?.length||'...'}</span></div>`
 ).join('');
}

function renderCards(t){
 accountTypes.innerHTML=t.map(a=>
 `<div class="account-card" id="c-${a}" onclick="selectType('${a}')">
   <div class="account-name">${a.toUpperCase()}</div>
   <div class="account-count">${accounts[a]?.length||0} entries</div>
 </div>`
 ).join('');
}

function selectType(t){
 document.querySelectorAll('.account-card').forEach(c=>c.classList.remove('selected'));
 document.getElementById('c-'+t).classList.add('selected');
 selected=t;
 getBtn.disabled=false;
}

function getAccount(){
 if(!selected)return;
 result.style.display='block';
 loading.style.display='block';
 resultContent.innerHTML='';
 setTimeout(()=>{
   const list=accounts[selected];
   const a=list[Math.floor(Math.random()*list.length)];
   loading.style.display='none';
   resultContent.innerHTML=
   `<div class="account-result">
     <div class="account-email">${a.email}</div>
     <div class="account-password">${a.pass}</div>
     <button onclick="navigator.clipboard.writeText('${a.email}:${a.pass}')">Copy</button>
   </div>`;
   againBtn.style.display='inline-block';
 },500);
}

getBtn.onclick=getAccount;
againBtn.onclick=getAccount;
init();
</script>

</body>
</html>
